<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AJB Leaders Academy</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── Page layout ── */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(145deg, #07111f 0%, #0d1f3c 50%, #172554 100%);
      position: relative;
      overflow: hidden;
    }

    /* Subtle background glow blobs */
    .login-page::before,
    .login-page::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
    }
    .login-page::before {
      width: 420px; height: 420px;
      background: #2563eb;
      top: -80px; left: -80px;
    }
    .login-page::after {
      width: 320px; height: 320px;
      background: #f59e0b;
      bottom: -60px; right: -60px;
    }

    /* ── Card ── */
    .login-card {
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(37,99,235,0.12);
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* ── School header ── */
    .school-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .school-logo {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      font-size: 28px;
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
    }
    .school-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #f8fafc;
      line-height: 1.3;
      margin: 0 0 4px;
    }
    .school-tagline {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #60a5fa;
      margin: 0;
    }

    /* ── Login role title ── */
    .login-role-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 28px;
      transition: all 0.3s ease;
    }

    /* ── Form fields ── */
    .field-group {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }
    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .field-wrap {
      position: relative;
    }
    .field-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      opacity: 0.55;
      pointer-events: none;
    }
    .field-input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(11,18,32,0.8);
      color: #f8fafc;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .field-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.18);
    }
    .field-input::placeholder { color: #4b5563; }

    /* ── Login button ── */
    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      color: #fff;
      letter-spacing: 0.04em;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(37,99,235,0.35);
      margin-top: 4px;
    }
    .login-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .login-btn:active { transform: translateY(0); }

    /* ── Principal badge (shown when principal mode) ── */
    .principal-badge {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      border-radius: 30px;
      padding: 5px 14px;
      margin: -16px auto 22px;
      width: fit-content;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fbbf24;
    }
    .principal-badge.visible { display: flex; }

    /* ── Message ── */
    .login-msg {
      text-align: center;
      font-size: 0.83rem;
      color: #94a3b8;
      min-height: 20px;
      margin-top: 12px;
    }
    .login-msg.error { color: #f87171; }
    .login-msg.success { color: #4ade80; }

    /* ── Golden star toggle ── */
    .star-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 28px;
      gap: 5px;
    }
    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      padding: 4px;
      border-radius: 50%;
      transition: transform 0.2s, filter 0.2s;
      filter: drop-shadow(0 0 4px rgba(245,158,11,0.5));
    }
    .star-btn:hover {
      transform: scale(1.25) rotate(10deg);
      filter: drop-shadow(0 0 8px rgba(245,158,11,0.9));
    }
    .star-hint {
      font-size: 0.65rem;
      color: #4b5563;
      letter-spacing: 0.06em;
    }

    /* ── Role indicator dots ── */
    .role-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 6px;
    }
    .role-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #1f2937;
      transition: background 0.3s;
    }
    .role-dot.active { background: #f59e0b; }

    @media (max-width: 480px) {
      .login-card { padding: 32px 22px 28px; }
      .school-name { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <!-- School Header -->
      <div class="school-header">
        <div class="school-logo">🏫</div>
        <h1 class="school-name">AJB Leaders Academy</h1>
        <p class="school-tagline">Staff Portal</p>
      </div>

      <!-- Principal badge (hidden by default) -->
      <div class="principal-badge" id="principalBadge">⭐ Principal Access</div>

      <!-- Role Title -->
      <div class="login-role-title" id="loginRoleTitle">Teacher Login</div>

      <!-- Form -->
      <form id="loginForm">
        <div class="field-group">
          <div>
            <label class="field-label" for="username">Username</label>
            <div class="field-wrap">
              <span class="field-icon">👤</span>
              <input class="field-input" id="username" type="text" placeholder="Enter your username" autocomplete="username" required />
            </div>
          </div>
          <div>
            <label class="field-label" for="password">Password</label>
            <div class="field-wrap">
              <span class="field-icon">🔒</span>
              <input class="field-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
            </div>
          </div>
        </div>

        <button class="login-btn" type="submit" id="loginBtn">Login as Teacher</button>
        <p class="login-msg" id="loginMessage"></p>
      </form>

      <!-- Star toggle -->
      <div class="star-area">
        <button class="star-btn" id="starBtn" title="Switch login role" aria-label="Toggle principal login">⭐</button>
        <span class="star-hint" id="starHint"></span>
        <div class="role-dots">
          <div class="role-dot active" id="dot1"></div>
          <div class="role-dot" id="dot2"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      let isPrincipal = false;
      const starBtn = document.getElementById('starBtn');
      const title = document.getElementById('loginRoleTitle');
      const badge = document.getElementById('principalBadge');
      const loginBtn = document.getElementById('loginBtn');
      const starHint = document.getElementById('starHint');
      const dot1 = document.getElementById('dot1');
      const dot2 = document.getElementById('dot2');

      starBtn.addEventListener('click', function () {
        isPrincipal = !isPrincipal;

        if (isPrincipal) {
          title.textContent = 'Principal Login';
          badge.classList.add('visible');
          loginBtn.textContent = 'Login as Principal';
          loginBtn.style.background = 'linear-gradient(135deg, #92400e, #f59e0b)';
          loginBtn.style.boxShadow = '0 6px 18px rgba(245,158,11,0.35)';
          starHint.textContent = 'Switch to Teacher';
          dot1.classList.remove('active');
          dot2.classList.add('active');
          starBtn.style.filter = 'drop-shadow(0 0 10px rgba(245,158,11,1))';
        } else {
          title.textContent = 'Teacher Login';
          badge.classList.remove('visible');
          loginBtn.textContent = 'Login as Teacher';
          loginBtn.style.background = 'linear-gradient(135deg, #1d4ed8, #3b82f6)';
          loginBtn.style.boxShadow = '0 6px 18px rgba(37,99,235,0.35)';
          starHint.textContent = 'Switch to Principal';
          dot1.classList.add('active');
          dot2.classList.remove('active');
          starBtn.style.filter = 'drop-shadow(0 0 4px rgba(245,158,11,0.5))';
        }
      });
    })();
  </script>
</body>
</html>
